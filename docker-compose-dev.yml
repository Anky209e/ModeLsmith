name: modelsmith-dev
services:
  web:
    build: .
    entrypoint: ["/usr/local/bin/entrypoint-dev.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./models:/app/models:ro
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
